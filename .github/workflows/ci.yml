name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs need to write to the repo or any GitHub API beyond reading it;
# the default GITHUB_TOKEN permissions are broader than that.
permissions:
  contents: read

jobs:
  cli-unit:
    name: CLI:Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          # None of these jobs push or commit back to the repo, so the checked-out
          # GITHUB_TOKEN doesn't need to stick around in git config for later steps
          # (e.g. `pnpm install` running third-party postinstall scripts) to read.
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/cli...

      - name: Build CLI
        working-directory: cli
        run: pnpm build

      - name: Run CLI unit tests
        working-directory: cli
        run: pnpm test

  cli-e2e:
    name: CLI:E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          # None of these jobs push or commit back to the repo, so the checked-out
          # GITHUB_TOKEN doesn't need to stick around in git config for later steps
          # (e.g. `pnpm install` running third-party postinstall scripts) to read.
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/cli... --filter @loopress/wordpress-plugin... --filter .

      - name: Build CLI
        working-directory: cli
        run: pnpm build

      # `loopress/setup-ci` installs the last *published* release of the plugin, since it's
      # also used to smoke-test real releases. That means these e2e tests would otherwise
      # exercise stale, already-released plugin code instead of this branch's changes, so
      # any fix landing here and there at the same time couldn't be verified by its own PR.
      # Loopress Full is installed, as a superset of Loopress Light: it covers both the
      # snippet-sync and composer-sync specs without a second WordPress instance.
      - name: Build this branch's plugin as installable zips (both editions)
        working-directory: wordpress-plugin
        run: pnpm run pack

      - name: Start WordPress
        uses: loopress/setup-ci@7d062dc4e6c0e6fa56e930a41f77ceb6ab91e4db # main

      - name: Install this branch's Loopress Full build over the released one
        run: |
          CONTAINER=$(docker ps --filter "ancestor=wordpress:latest" --format "{{.ID}}" | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "::error::Could not find the WordPress container started by loopress/setup-ci"
            exit 1
          fi
          # `wp plugin install --force` only replaces a plugin already installed under the
          # SAME folder/slug as the zip being installed. `loopress/setup-ci` pre-installs the
          # last *published* release, which may still be under the pre-rename "loopress" slug
          # (this build's zip now unpacks to "loopress-full"), so `--force` alone would silently
          # leave that stale build active side by side with this one instead of replacing it,
          # and this repo's own coexistence guard would then make the stale build win. Clearing
          # every slug this plugin has ever shipped under first makes the install deterministic
          # regardless of which one the baseline happens to be on.
          docker exec "$CONTAINER" wp plugin deactivate loopress loopress-full loopress-light --allow-root || true
          docker exec "$CONTAINER" wp plugin delete loopress loopress-full loopress-light --allow-root || true
          docker cp wordpress-plugin/loopress-full.zip "$CONTAINER":/tmp/loopress-full.zip
          docker exec "$CONTAINER" wp plugin install /tmp/loopress-full.zip --activate --allow-root

      - name: Extract app password
        id: wp-creds
        run: |
          TOKEN=$(jq -r '.projects[.currentProject.id].environments[.currentProject.env].token' "${XDG_CONFIG_HOME:-$HOME/.config}/loopress/config.json")
          echo "app-password=${TOKEN#*:}" >> $GITHUB_OUTPUT

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CLI e2e tests
        env:
          WP_URL: http://localhost:8080
          # @wordpress/e2e-test-utils-playwright's own REST API discovery (getAPIRootURL, used
          # by the requestUtils fixture) reads this env var directly rather than the baseURL
          # passed to RequestUtils.setup(), defaulting to http://localhost:8889 if unset, a
          # bare HEAD request that ECONNREFUSEs against this job's actual WordPress port.
          WP_BASE_URL: http://localhost:8080
          WP_USERNAME: admin
          # Matches the account password `loopress/setup-ci` hardcodes when it runs
          # `wp core install --admin_password="admin"` — needed for wp-admin UI login,
          # distinct from the REST API application password above.
          WP_ADMIN_PASSWORD: admin
          WP_APP_PASSWORD: ${{ steps.wp-creds.outputs.app-password }}
        run: pnpm test:e2e

      # Videos and traces are only kept for failed tests (playwright.config.ts:
      # video/trace: 'retain-on-failure'), so this is near-empty on a green run and the one
      # thing worth downloading on a red one — no separate reporter surfaces these otherwise.
      - name: Upload Playwright videos and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1 v4
        with:
          name: playwright-videos-traces
          path: test-results/

  plugin-php:
    name: Plugin:PHPStan + PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          # None of these jobs push or commit back to the repo, so the checked-out
          # GITHUB_TOKEN doesn't need to stick around in git config for later steps
          # (e.g. `pnpm install` running third-party postinstall scripts) to read.
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Rector check (strict_types, style rules)
        run: composer run rector:check

      - name: PHPStan analysis
        run: composer run analyse

      - name: Run psalm
        run: composer run psalm

      - name: PHP CodeSniffer
        run: composer run cs

      - name: PHPUnit tests
        run: composer run test

  plugin-deptrac:
    name: Plugin:Light/Plus boundary (Deptrac)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Source-level guard, complementing (not replacing) plugin-light-artifact-guard below:
      # this catches a Light class importing Plus-only code (Dependencies/Update/Snippets) at
      # PR-review time on source, rather than only downstream on the built Light zip.
      - name: Run Deptrac (Light / Plus dependency boundary)
        run: composer run deptrac

  plugin-frontend:
    name: Plugin:Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          # None of these jobs push or commit back to the repo, so the checked-out
          # GITHUB_TOKEN doesn't need to stick around in git config for later steps
          # (e.g. `pnpm install` running third-party postinstall scripts) to read.
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/wordpress-plugin...

      - name: Run tests
        working-directory: wordpress-plugin
        run: pnpm test

      - name: Run build
        working-directory: wordpress-plugin
        run: pnpm build

  plugin-light-artifact-guard:
    name: Plugin:Loopress Light artifact contains no Composer or Snippets code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/wordpress-plugin...

      - name: Build the Loopress Light edition zip
        working-directory: wordpress-plugin
        run: pnpm run pack:light

      # wordpress.org guidelines forbid a plugin from shipping Composer/Packagist
      # installer code even inactive, and separately rejected the snippet sync feature itself
      # as a remote arbitrary-code-deployment mechanism. This asserts the Loopress Light
      # artifact never regresses either, rather than trusting the build script's stripping
      # logic to always be correct.
      - name: Assert the Loopress Light zip contains no Composer/Packagist or Snippets code
        working-directory: wordpress-plugin
        run: |
          rm -rf /tmp/loopress-light-check
          mkdir /tmp/loopress-light-check
          unzip -q loopress-light.zip -d /tmp/loopress-light-check
          if find /tmp/loopress-light-check/loopress-light/src -type d -name Dependencies | grep -q .; then
            echo "::error::Loopress Light artifact contains src/Dependencies"
            exit 1
          fi
          if find /tmp/loopress-light-check/loopress-light/src -type d -name Snippets | grep -q .; then
            echo "::error::Loopress Light artifact contains src/Snippets"
            exit 1
          fi
          if [ -f /tmp/loopress-light-check/loopress-light/uninstall.php ]; then
            echo "::error::Loopress Light artifact contains uninstall.php"
            exit 1
          fi
          if grep -RiIl --include='*.php' -E 'composer|packagist' /tmp/loopress-light-check/loopress-light/src /tmp/loopress-light-check/loopress-light/loopress.php; then
            echo "::error::Loopress Light artifact PHP source references Composer/Packagist"
            exit 1
          fi
          # Matches the actual namespace/route, not bare class names: SeoService.php and
          # AcfService.php legitimately mention "SnippetService"/"CodeSnippetsSnippetProvider"
          # by name in explanatory comments (contrasting their own single-provider/no-provider
          # shape with the snippets feature's multi-provider one), which a bare class-name grep
          # would false-positive on.
          if grep -RiIl --include='*.php' -E 'Loopress\\Snippets|loopress/v1/snippets' /tmp/loopress-light-check/loopress-light/src /tmp/loopress-light-check/loopress-light/loopress.php; then
            echo "::error::Loopress Light artifact PHP source references the Snippets feature"
            exit 1
          fi
          # if grep -il -E 'packagist|dependency management' /tmp/loopress-light-check/loopress-light/build/index.tsx.js; then
          #   echo "::error::Loopress Light artifact JS bundle references Composer/Packagist"
          #   exit 1
          # fi
          # The bundled vendor/ sits under the public webroot once installed. build-flavor.cjs
          # drops an .htaccess denying direct HTTP access (installed.json/installed.php leak the
          # dependency tree otherwise); assert wp-scripts plugin-zip actually shipped it, since
          # npm-packlist has stripped dotfiles from zips before.
          if [ ! -f /tmp/loopress-light-check/loopress-light/vendor/.htaccess ]; then
            echo "::error::Loopress Light artifact is missing vendor/.htaccess (direct vendor access not blocked)"
            exit 1
          fi
