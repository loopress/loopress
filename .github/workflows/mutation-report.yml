name: 🧬 Mutation reports

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cli-mutation:
    name: CLI mutation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/cli...

      - name: Run mutation tests
        working-directory: cli
        run: pnpm test:mutation

      - name: Upload mutation report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1 v4
        with:
          name: cli-mutation-report
          path: cli/reports/mutation

  plugin-mutation:
    name: Plugin mutation report (Infection)
    runs-on: ubuntu-latest
    # Report-only for now, not a merge gate (see wordpress-plugin/infection.json5).
    continue-on-error: true
    defaults:
      run:
        working-directory: wordpress-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run mutation testing
        run: composer run mutation

      - name: Upload mutation report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1 v4
        with:
          name: plugin-mutation-report
          path: |
            wordpress-plugin/infection.html
            wordpress-plugin/infection-summary.log

  deploy:
    name: Publish reports to GitHub Pages
    needs: [cli-mutation, plugin-mutation]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download CLI mutation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1 v4
        with:
          name: cli-mutation-report
          path: site

      - name: Download plugin mutation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1 v4
        with:
          name: plugin-mutation-report
          path: site/plugin

      # CLI report is served at the site root, plugin report is nested under /plugin/,
      # since GitHub Pages deploys a single artifact and both reports share this site.
      - name: Arrange Pages content
        run: |
          mv site/mutation.html site/index.html
          mv site/plugin/infection.html site/plugin/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0 v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0 v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0 v4
