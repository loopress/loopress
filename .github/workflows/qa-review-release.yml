name: 🔍 QA review (release)

# A developer approving the changesets "Version Packages" PR
# (changeset-release/main -> main) triggers this release QA review.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

env:
  LOOPRESS_TELEMETRY_DISABLED: "1" # don't ship QA-run crash reports to Sentry

jobs:
  qa-review:
    name: Claude QA review
    if: >
      (github.event.review.state == 'approved' &&
       github.event.pull_request.head.ref == 'changeset-release/main')
    # Job-level (not workflow-level): a skipped run (comment-only review,
    # wrong branch) never enters the group, so it can't cancel a real one.
    concurrency:
      group: qa-review-release-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=12
          --health-start-period=30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, intl
          coverage: none

      - name: Build this release candidate's plugin zips and CLI
        run: |
          pnpm install --frozen-lockfile \
            --filter @loopress/cli... --filter @loopress/wordpress-plugin...
          pnpm --filter @loopress/wordpress-plugin run pack
          pnpm --filter @loopress/cli run build

      - name: Boot a blank WordPress with the plugin installed
        env:
          PHP_CLI_SERVER_WORKERS: "8" # PHP built-in server forks workers, so loopback REST calls don't deadlock
        run: |
          set -euo pipefail
          sudo curl -sSL -o /usr/local/bin/wp \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo chmod +x /usr/local/bin/wp

          WP_DIR="$RUNNER_TEMP/wp"
          mkdir -p "$WP_DIR"
          wp --path="$WP_DIR" core download
          wp --path="$WP_DIR" config create \
            --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          # App passwords only work over plain HTTP when the env type is 'local'.
          wp --path="$WP_DIR" config set WP_ENVIRONMENT_TYPE local
          wp --path="$WP_DIR" config set WP_DEBUG true --raw
          wp --path="$WP_DIR" config set WP_DEBUG_LOG true --raw
          wp --path="$WP_DIR" core install \
            --url=http://localhost:8080 --title="Loopress QA" \
            --admin_user=admin --admin_password=admin \
            --admin_email=qa@loopress.dev --skip-email

          APP_PW=$(wp --path="$WP_DIR" user application-password create admin qa --porcelain)

          nohup wp --path="$WP_DIR" server --host=0.0.0.0 --port=8080 \
            > "$RUNNER_TEMP/wp-server.log" 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8080; do sleep 1; done'

          # Lets the QA session run bare `wp ...` from the repo root, no --path needed.
          printf 'path: %s\nurl: http://localhost:8080\n' "$WP_DIR" > "$GITHUB_WORKSPACE/wp-cli.yml"

          # Loopress CLI on PATH (this branch's build) + configured against this
          # site as project "ci" / environment "local", so `lps --env local`
          # works non-interactively.
          printf '#!/usr/bin/env bash\nexec node "%s/cli/bin/run.js" "$@"\n' "$GITHUB_WORKSPACE" \
            | sudo tee /usr/local/bin/lps >/dev/null
          sudo chmod +x /usr/local/bin/lps
          CFG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/loopress"
          mkdir -p "$CFG_DIR"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "$CFG_DIR/config.json" <<JSON
          {
            "currentProject": { "env": "local", "id": "ci" },
            "projects": {
              "ci": {
                "addedAt": "$NOW",
                "name": "ci",
                "environments": {
                  "local": { "addedAt": "$NOW", "name": "local", "token": "admin:$APP_PW", "url": "http://localhost:8080" }
                }
              }
            }
          }
          JSON

          # Prepare the site: install this release candidate's plugin build.
          wp --path="$WP_DIR" plugin install \
            "$GITHUB_WORKSPACE/wordpress-plugin/loopress-full.zip" --activate

          {
            echo "WP_PATH=$WP_DIR"
            echo "WP_URL=http://localhost:8080"
            echo "WP_USERNAME=admin"
            echo "WP_ADMIN_PASSWORD=admin"
            echo "WP_APP_PASSWORD=$APP_PW"
          } >> "$GITHUB_ENV"

      - name: Install rtk
        run: |
          set -euo pipefail
          curl -sSL -o rtk.tar.gz \
            https://github.com/rtk-ai/rtk/releases/download/v0.42.3/rtk-x86_64-unknown-linux-musl.tar.gz
          echo "5df764a633709cb85d248258d085d24ec95faa8bca0e6835a93cd57cadc4eb9e  rtk.tar.gz" | sha256sum -c -
          tar -xzf rtk.tar.gz
          sudo mv rtk /usr/local/bin/rtk
          sudo chmod +x /usr/local/bin/rtk
          rtk --version

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        env:
          WP_PATH: ${{ env.WP_PATH }}
          WP_URL: ${{ env.WP_URL }}
          WP_USERNAME: ${{ env.WP_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ env.WP_ADMIN_PASSWORD }}
          WP_APP_PASSWORD: ${{ env.WP_APP_PASSWORD }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bypasses the Claude App's OIDC path, which refuses to run while the
          # workflow file differs from main. Drop this line once merged to main
          # to have comments posted as the Claude app instead of github-actions.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the changesets "Version Packages" release PR
            (changeset-release/main -> main), just approved by a developer.
            You are doing a release-readiness QA pass, in two parts.

            ## 1. Changelog / semver review
            This PR's own diff is just the version bumps and CHANGELOG.md
            edits (the changeset bot already merged the real feature commits
            into main earlier), so diffing the PR itself shows nothing
            useful. For each package whose CHANGELOG.md changed here, find
            its previous release tag (tags look like `wordpress-plugin@2026.8.1`
            or `@loopress/cli@0.22.0`, e.g. `git tag -l '<package>@*' --sort=-creatordate | head`)
            and diff from that tag to main, scoped to that package's
            directory, to see the commits this release actually contains.
            - Compare CHANGELOG.md entries against those commits; flag any
              that don't match, or a change with no changeset entry.
            - Check semver bumps fit the changes (no breaking change as a patch).
            - @loopress/cli and @loopress/mcp are a fixed group in
              .changeset/config.json: flag it if their versions differ.
            - If wordpress-plugin/package.json was bumped, sanity check its
              CHANGELOG.md entry too.

            ## 2. Live smoke test on a real WordPress
            A throwaway WordPress is running with this release candidate's
            wordpress-plugin/loopress-full.zip installed and active (nothing
            else). Env: WP_URL (http://localhost:8080), WP_USERNAME,
            WP_ADMIN_PASSWORD, WP_APP_PASSWORD. Run WP-CLI as plain `wp ...`
            from the repo root. WP_DEBUG and the debug log are on
            (wp-content/debug.log under WP_PATH).

            The Loopress CLI is installed as `lps` (this branch's build) and
            pre-configured against this site (project "ci", environment
            "local"). It runs non-interactively: pass `--env local`, and
            `--yes` on any command that would otherwise confirm.

            Exercise the scenarios relevant to what this release changes (read
            the diff first). Suggested:
            - Confirm activation is clean: no fatals/notices in debug.log,
              `wp plugin list` shows loopress-full active.
            - CLI round trip: for each feature this release touches (snippet,
              acf, seo, app, page, form, api, composer), run its `lps <feature>
              list` / `pull` / `push --env local` against the live site and
              confirm it works end to end. Install any companion plugin a
              feature needs yourself with `wp plugin install <slug> --activate`
              (WPCode = insert-headers-and-footers, ACF =
              advanced-custom-fields, SEO = seo-by-rank-math or wordpress-seo).
            - REST: curl WP_URL/wp-json/loopress/v1/... with the app password
              and confirm the endpoints respond sanely.
            - Load the plugin's wp-admin pages and confirm they render.
            - Fresh reinstall + uninstall the zip, re-checking the debug log.

            Keep exploration tight: prefer `--stat` before full diffs, grep
            debug.log for `fatal|warning|error` instead of catting the whole
            file, and don't run unbounded `git log` over the full repo
            history.

            ## Output
            Post ONE top-level summary comment with `gh pr comment` covering
            both parts. If all good, say so explicitly. No inline comments, no
            chat-only output.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(wp:*),Bash(lps:*),Bash(curl:*),Bash(jq:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
