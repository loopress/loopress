name: 🔍 QA review (release)

# A developer approving the changesets "Version Packages" PR
# (changeset-release/main -> main) triggers this release QA review.
on:
  pull_request_review:
    types: [submitted]
  pull_request: # TEMP (testing on ci/qa-review-release-branch): remove when done

concurrency: qa-review-release-${{ github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-review:
    name: Claude QA review
    if: >
      github.event.pull_request.head.ref == 'ci/qa-review-release-branch' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.head.ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=12
          --health-start-period=30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, intl
          coverage: none

      - name: Build this release candidate's plugin zips (Full + Light)
        run: |
          pnpm install --frozen-lockfile --filter @loopress/wordpress-plugin...
          pnpm --filter @loopress/wordpress-plugin run pack

      - name: Boot a blank WordPress
        env:
          PHP_CLI_SERVER_WORKERS: "8" # PHP built-in server forks workers, so loopback REST calls don't deadlock
        run: |
          set -euo pipefail
          sudo curl -sSL -o /usr/local/bin/wp \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo chmod +x /usr/local/bin/wp

          WP_DIR="$RUNNER_TEMP/wp"
          mkdir -p "$WP_DIR"
          wp --path="$WP_DIR" core download --version=latest
          wp --path="$WP_DIR" config create \
            --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          # App passwords only work over plain HTTP when the env type is 'local'.
          wp --path="$WP_DIR" config set WP_ENVIRONMENT_TYPE local
          wp --path="$WP_DIR" config set WP_DEBUG true --raw
          wp --path="$WP_DIR" config set WP_DEBUG_LOG true --raw
          wp --path="$WP_DIR" core install \
            --url=http://localhost:8080 --title="Loopress QA" \
            --admin_user=admin --admin_password=admin \
            --admin_email=qa@loopress.dev --skip-email

          APP_PW=$(wp --path="$WP_DIR" user application-password create admin qa --porcelain)

          nohup wp --path="$WP_DIR" server --host=0.0.0.0 --port=8080 \
            > "$RUNNER_TEMP/wp-server.log" 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8080; do sleep 1; done'

          # Lets the QA session run bare `wp ...` from the repo root, no --path needed.
          printf 'path: %s\nurl: http://localhost:8080\n' "$WP_DIR" > "$GITHUB_WORKSPACE/wp-cli.yml"
          {
            echo "WP_PATH=$WP_DIR"
            echo "WP_URL=http://localhost:8080"
            echo "WP_USERNAME=admin"
            echo "WP_ADMIN_PASSWORD=admin"
            echo "WP_APP_PASSWORD=$APP_PW"
          } >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        env:
          WP_PATH: ${{ env.WP_PATH }}
          WP_URL: ${{ env.WP_URL }}
          WP_USERNAME: ${{ env.WP_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ env.WP_ADMIN_PASSWORD }}
          WP_APP_PASSWORD: ${{ env.WP_APP_PASSWORD }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bypasses the Claude App's OIDC path, which refuses to run while the
          # workflow file differs from main. Drop this line once merged to main
          # to have comments posted as the Claude app instead of github-actions.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true # TEMP: real API errors in the log, remove when green
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the changesets "Version Packages" release PR
            (changeset-release/main -> main), just approved by a developer.
            You are doing a release-readiness QA pass, in two parts.

            ## 1. Changelog / semver review
            - Compare CHANGELOG.md entries against the actual commit diffs; flag
              any that don't match, or a change with no changeset entry.
            - Check semver bumps fit the changes (no breaking change as a patch).
            - @loopress/cli and @loopress/mcp are a fixed group in
              .changeset/config.json: flag it if their versions differ.
            - If wordpress-plugin/package.json was bumped, sanity check its
              CHANGELOG.md entry too.

            ## 2. Live smoke test on a blank WordPress
            A throwaway WordPress with ONLY WordPress core is running (no plugins).
            Env vars: WP_URL (http://localhost:8080), WP_USERNAME,
            WP_ADMIN_PASSWORD, WP_APP_PASSWORD. Run WP-CLI as plain `wp ...` from
            the repo root (a wp-cli.yml points it at the site). WP_DEBUG and the
            debug log are on: wp-content/debug.log under WP_PATH.

            This release candidate's freshly built zips are at
            wordpress-plugin/loopress-full.zip and .../loopress-light.zip.

            Do the install yourself and exercise the scenarios relevant to what
            this release actually changes (read the diff first). Suggested:
            - Fresh install + activate loopress-full.zip; confirm activation is
              clean (no fatals/notices in debug.log), `wp plugin list` looks right.
            - Any companion plugin a scenario needs (WPCode = insert-headers-and-
              footers, ACF = advanced-custom-fields, SEO = seo-by-rank-math /
              wordpress-seo) you install yourself with `wp plugin install <slug>
              --activate`.
            - REST: curl WP_URL/wp-json/loopress/v1/... with the app password and
              confirm the endpoints respond sanely.
            - Load the plugin's wp-admin pages and confirm they render.
            - Deactivate / reactivate / uninstall and re-check the debug log.

            ## Output
            Post ONE top-level summary comment with `gh pr comment` covering both
            parts. If all good, say so explicitly. No inline comments, no
            chat-only output.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(wp:*),Bash(curl:*),Bash(jq:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
