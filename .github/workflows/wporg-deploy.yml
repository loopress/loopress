name: 🚀 Deploy Loopress Light to WordPress.org

# Manual only. The WordPress.org guidelines ask plugins not to commit to SVN on
# every push, so the directory deploy is triggered by hand when a release is
# worth shipping there, separately from the GitHub release in release.yml.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag/branch/SHA, e.g. wordpress-plugin@2026.8.1). Defaults to this run's ref."
        required: false
      version:
        description: Override the published version. Defaults to the checked-out package.json version.
        required: false
      dry_run:
        description: Build and diff against SVN without committing
        type: boolean
        default: false

concurrency: wporg-deploy

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @loopress/wordpress-plugin...

      # Resolve the version to publish, then write it into package.json so the next
      # step (sync-version.js) propagates it into loopress.php and both readme.txt.
      # No commit: this is a throwaway checkout. With the `version` input empty this
      # is a no-op rewrite of the value already there.
      - name: Resolve version
        id: version
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V=$(jq -r '.version' wordpress-plugin/package.json)
          tmp=$(mktemp)
          jq --arg v "$V" '.version = $v' wordpress-plugin/package.json > "$tmp"
          mv "$tmp" wordpress-plugin/package.json
          echo "value=$V" >> "$GITHUB_OUTPUT"

      # Re-derive readme.txt "Stable tag" and the plugin Version header from
      # package.json so they always match VERSION below (the deploy action refuses
      # a mismatch between the tag and the packaged readme.txt).
      - name: Sync plugin version header
        working-directory: wordpress-plugin
        run: pnpm run version

      - name: Build the Loopress Light edition zip
        working-directory: wordpress-plugin
        run: pnpm run pack:light

      - name: Unzip build for SVN
        run: unzip -q wordpress-plugin/loopress-light.zip -d /tmp/wporg

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: loopress-light
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_DIR: /tmp/wporg/loopress-light
          ASSETS_DIR: wordpress-plugin/.wordpress-org
