# Automatic Analysis only honors a fixed subset of properties here (no
# sonar.issue.ignore.*, no wildcards), so per-rule suppression isn't possible.
# pnpm already refuses to run dependency lifecycle scripts unless explicitly
# allowed (pnpm.onlyBuiltDependencies), making githubactions:S6505 moot for
# these workflows; excluding them from analysis entirely is the only lever
# available, which also drops other Sonar checks on these files.
# ponytail: new files under .github/workflows/ must be added here manually,
# no glob support in this file.
sonar.exclusions=.github/workflows/*.yml

# Test files legitimately repeat arrange/setup blocks (fixtures, mock wiring,
# similar assertions per case). Deduplicating that hurts readability, so
# copy-paste detection is disabled for tests. Match by filename since suites
# are both colocated (wordpress-plugin/**/*.test.tsx) and nested
# (cli/test/commands/page/*.test.ts); a **/test/* glob would miss both.
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*,**/test/**