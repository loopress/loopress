packages:
  - "assets"
  - "cli"
  - "documentation"
  - "eslint-config"
  - "mcp"
  - "website"
  - "wordpress-plugin"
  - "!cli/demo/**"
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  yarn: true
minimumReleaseAgeExclude:
  - adm-zip@0.6.1
overrides:
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  ip-address@<=10.7.3: ^10.7.4
  js-yaml@>=5.0.0 <=5.4.0: ^5.4.1
  katex@>=0.11.0 <0.18.2: ^0.18.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  eslint-plugin-import-x>minimatch: ^10.2.6
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  qs@>=2.2.5 <6.16.1: ^6.16.1
  qs@>=6.7.0 <=6.16.0: ^6.16.1
  serialize-javascript@<7.1.3: ^7.1.3
  sharp@<0.35.5: ^0.35.5
  smol-toml@<=1.8.0: ^1.9.0
  zod@<4.6.6: ^4.6.6
