packages:
  - "assets"
  - "cli"
  - "documentation"
  - "eslint-config"
  - "mcp"
  - "website"
  - "wordpress-plugin"
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  yarn: true
minimumReleaseAgeExclude:
  - hosted-git-info@2.8.9 || 3.0.8
  - ini@1.3.6
  - nth-check@2.0.1
  - path-to-regexp@6.3.0
  - cookie@0.7.0
  - '@eslint/plugin-kit@0.3.4'
  - webpack-dev-server@5.2.1 || 5.2.4 || 5.2.5 || 5.2.6
  - semver@4.3.2 || 5.7.2 || 6.3.1
  - serialize-javascript@6.0.2 || 7.0.3 || 7.0.5
  - uuid@11.1.1
  - qs@6.15.2
  - markdown-it@14.1.2
  - linkify-it@5.0.1 || 5.0.2
  - adm-zip@0.6.0
  - svgo@3.3.4
  - fast-uri@3.1.4 || 3.1.5
  - minimatch@3.1.3 || 3.1.4
  - '@opentelemetry/core@2.8.0'
overrides:
  '@eslint/plugin-kit@<0.3.4': ^0.3.4
  '@opentelemetry/core@<2.8.0': ^2.8.0
  adm-zip@<0.6.0: ^0.6.0
  cookie@<0.7.0: ^0.7.0
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  hosted-git-info@<2.8.9: ^2.8.9
  hosted-git-info@>=3.0.0 <3.0.8: ^3.0.8
  ini@<1.3.6: ^1.3.6
  linkify-it@<=5.0.0: ^5.0.1
  linkify-it@<=5.0.1: ^5.0.2
  markdown-it@<=14.1.1: ^14.1.2
  minimatch@<3.1.3: ^3.1.3
  minimatch@<3.1.4: ^3.1.4
  nth-check@<2.0.1: ^2.0.1
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  qs@>=6.11.1 <=6.15.1: ^6.15.2
