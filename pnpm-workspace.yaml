packages:
  - "assets"
  - "cli"
  - "documentation"
  - "eslint-config"
  - "mcp"
  - "website"
  - "wordpress-plugin"
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  yarn: true
minimumReleaseAgeExclude:
  - path-to-regexp@6.3.0
  - minimatch@3.1.3 || 3.1.4
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - qs@6.15.2
  - markdown-it@14.1.2
  - '@opentelemetry/core@2.8.0'
  - linkify-it@5.0.1 || 5.0.2
  - adm-zip@0.6.0
  - fast-uri@3.1.5
  - js-yaml@3.15.1
overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  adm-zip@<0.6.0: ^0.6.0
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  linkify-it@<=5.0.0: ^5.0.1
  linkify-it@<=5.0.1: ^5.0.2
  markdown-it@<=14.1.1: ^14.1.2
  minimatch@<3.1.3: ^3.1.3
  minimatch@<3.1.4: ^3.1.4
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  uuid@<11.1.1: ^11.1.1
